<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WhatCompany</title>
<meta name="description" content="Career fair companion">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WhatCompany">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<script>try{var t=localStorage.getItem('wc-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <section id="tab-companies" class="tab">
    <header class="bar">
      <h1>Companies</h1>
      <button class="btn primary icon-btn" id="addCompany" aria-label="Add company">+</button>
    </header>
    <div class="tools">
      <input type="search" id="search" placeholder="Search companies" autocomplete="off">
      <div class="chips scroll-x" id="statusFilter"></div>
    </div>
    <div id="companyList" class="cards"></div>
  </section>

  <section id="tab-ask" class="tab" hidden>
    <header class="bar"><h1>Ask</h1></header>
    <div id="askView" class="pad"></div>
  </section>

  <section id="tab-me" class="tab" hidden>
    <header class="bar">
      <h1>Me</h1>
      <button class="btn" id="meEdit">Edit</button>
    </header>
    <div id="meView" class="pad"></div>
  </section>

  <section id="tab-cv" class="tab" hidden>
    <header class="bar">
      <h1>CV</h1>
      <button class="btn primary" id="showQr">Show QR</button>
    </header>
    <div id="cvView" class="pad"></div>
  </section>
</main>

<nav class="tabbar" id="tabbar">
  <button data-tab="companies" aria-selected="true">
    <svg viewBox="0 0 24 24"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 10h4a1 1 0 0 1 1 1v10M2 21h20M8 8h3M8 12h3M8 16h3"/></svg>
    <span>Companies</span></button>
  <button data-tab="ask">
    <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.8A8 8 0 1 1 21 12z"/><path d="M10 9.5a2.2 2.2 0 1 1 3 2c-.6.3-1 .8-1 1.5M12 16h.01"/></svg>
    <span>Ask</span></button>
  <button data-tab="me">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
    <span>Me</span></button>
  <button data-tab="cv">
    <svg viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>
    <span>CV</span></button>
</nav>

<div id="sheet" class="sheet" hidden></div>
<div id="viewer" class="viewer" hidden></div>
<div id="qrScreen" class="qr-screen" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="vendor/qrcode.js"></script>
<script src="app.js"></script>
</body>
</html>
